services:
  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      AAMAD_TARGET_RUNTIME: ${AAMAD_TARGET_RUNTIME:-crewai}
      MODEL: ${MODEL:-gpt-5.5}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/storage/recruitment_assistant.db}
      STORAGE_DIR: ${STORAGE_DIR:-/app/storage}
      CREWAI_STORAGE_DIR: ${CREWAI_STORAGE_DIR:-/app/storage/crewai}
      MAX_CANDIDATES_PER_RUN: ${MAX_CANDIDATES_PER_RUN:-10}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CREWAI_MAX_ITER: ${CREWAI_MAX_ITER:-8}
      CREWAI_MAX_RPM: ${CREWAI_MAX_RPM:-30}
      CREWAI_MAX_EXECUTION_TIME: ${CREWAI_MAX_EXECUTION_TIME:-120}
      CREWAI_TEMPERATURE: ${CREWAI_TEMPERATURE:-0.2}
      CREWAI_MAX_TOKENS: ${CREWAI_MAX_TOKENS:-4000}
    volumes:
      - recruitment-storage:/app/storage
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    image: nginx:1.27-alpine
    ports:
      - "4173:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      backend:
        condition: service_healthy

volumes:
  recruitment-storage: